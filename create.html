<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add Cards — Recall Manual</title>
<link rel="stylesheet" href="css/theme.css" />
<script>
  (function () {
    try {
      if ((localStorage.getItem('recall_manual_theme') || 'light') === 'dark') {
        document.documentElement.classList.add('theme-dark');
      }
    } catch (e) {}
  })();
</script>
<style>
  .back-link { font-size: 0.85rem; color: var(--ink-soft); }
  .deck-label { font-size: 0.9rem; color: var(--ink-soft); margin: -6px 0 16px; }

  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .mode-tabs button {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border);
    background: var(--glass-fill);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .mode-tabs button.active {
    background: var(--blossom);
    color: white;
    border-color: transparent;
  }

  .side-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .side-toggle button {
    flex: 1;
    padding: 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.5);
    color: var(--ink);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .side-toggle button.active {
    background: var(--glass-fill-strong);
    box-shadow: inset 0 0 0 2px var(--blossom);
  }
  .side-toggle .filled-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--tag-green);
    margin-left: 6px;
  }

  .editor-panel { padding: 18px; }

  textarea.text-input {
    width: 100%;
    min-height: 140px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.7);
    padding: 14px;
    font-family: var(--font-body);
    font-size: 0.95rem;
    resize: vertical;
  }

  canvas.draw-canvas {
    width: 100%;
    height: 260px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border);
    touch-action: none;
    background: white;
  }
  .draw-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; flex-wrap: wrap; gap: 10px; }
  .draw-tools button.clear-btn {
    font-size: 0.78rem;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.6);
    cursor: pointer;
  }

  .brush-toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brush-group { display: flex; align-items: center; gap: 6px; }
  .brush-group .brush-label { font-size: 0.7rem; color: var(--ink-soft); margin-right: 2px; }
  .swatch {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.9);
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    cursor: pointer;
    padding: 0;
  }
  .swatch.selected { box-shadow: 0 0 0 2px var(--ink); }
  .swatch.highlighter { border-radius: 6px; width: 30px; height: 20px; }
  .swatch.eraser-swatch {
    background: #f4f0ee;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
  }
  .swatch.eraser-swatch svg { width: 15px; height: 15px; }

  .brush-sliders {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--glass-border);
  }
  .slider-group { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 140px; }
  .slider-group label { font-size: 0.72rem; color: var(--ink-soft); flex-shrink: 0; width: 46px; }
  .slider-group input[type="range"] { flex: 1; min-width: 60px; accent-color: var(--blossom); }
  .slider-group .slider-value { font-size: 0.7rem; color: var(--ink-soft); width: 30px; text-align: right; flex-shrink: 0; }
  .slider-group.disabled { opacity: 0.4; pointer-events: none; }

  .photo-source-buttons { display: flex; gap: 10px; }
  .photo-source-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 16px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.55);
    color: var(--ink);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
  }
  .photo-source-btn svg { width: 22px; height: 22px; color: var(--ink-soft); }
  .photo-preview { width: 100%; border-radius: var(--radius-sm); margin-top: 10px; display: none; }
  .photo-replace-row { display: flex; gap: 8px; margin-top: 8px; display: none; }
  .photo-replace-row button {
    flex: 1;
    font-size: 0.75rem;
    padding: 7px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.5);
    cursor: pointer;
  }

  .save-row { margin-top: 20px; display: flex; gap: 10px; }
  .save-row button { flex: 1; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: white;
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="sakura-canvas"></canvas>

<div class="app-shell">
  <div class="topbar">
    <div>
      <a class="back-link" href="index.html">&larr; Decks</a>
      <h1 style="margin-top:4px">Add a card</h1>
    </div>
  </div>

  <div class="container">
    <div class="deck-label" id="deckLabel">Loading deck…</div>

    <div class="side-toggle">
      <button data-side="front" class="active">Front <span class="filled-dot" id="frontDot" style="display:none"></span></button>
      <button data-side="back">Back <span class="filled-dot" id="backDot" style="display:none"></span></button>
    </div>

    <div class="mode-tabs">
      <button data-mode="text" class="active">Type</button>
      <button data-mode="draw">Draw</button>
      <button data-mode="photo">Photo</button>
    </div>

    <div class="glass editor-panel">
      <!-- Text -->
      <div class="mode-panel" data-panel="text">
        <textarea class="text-input" id="textInputFront" placeholder="Front side text…"></textarea>
        <textarea class="text-input" id="textInputBack" placeholder="Back side text…" style="display:none"></textarea>
      </div>

      <!-- Draw -->
      <div class="mode-panel" data-panel="draw">
        <canvas class="draw-canvas" id="drawCanvasFront" style="display:none"></canvas>
        <canvas class="draw-canvas" id="drawCanvasBack" style="display:none"></canvas>
        <div id="drawChrome" style="display:none">
          <div class="draw-tools">
            <div class="brush-toolbar">
              <div class="brush-group">
                <span class="brush-label">Pencil</span>
                <button class="swatch selected" data-color="black" data-highlighter="false" style="background:#242021" aria-label="Black pencil"></button>
                <button class="swatch" data-color="red" data-highlighter="false" style="background:#c23b3b" aria-label="Red pencil"></button>
                <button class="swatch" data-color="blue" data-highlighter="false" style="background:#2e5fa3" aria-label="Blue pencil"></button>
                <button class="swatch eraser-swatch" data-eraser="true" aria-label="Eraser">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 20H9l-6-6a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L13 20"></path>
                    <path d="M6 14l6 6"></path>
                  </svg>
                </button>
              </div>
              <div class="brush-group">
                <span class="brush-label">Highlighter</span>
                <button class="swatch highlighter" data-color="yellow" data-highlighter="true" style="background:#f5d90a" aria-label="Yellow highlighter"></button>
                <button class="swatch highlighter" data-color="red" data-highlighter="true" style="background:#ff5c7a" aria-label="Red highlighter"></button>
              </div>
            </div>
            <button class="clear-btn" id="clearDrawBtn">Clear</button>
          </div>
          <div class="brush-sliders">
            <div class="slider-group">
              <label for="sizeSlider">Size</label>
              <input type="range" id="sizeSlider" min="1" max="8" step="0.5" value="2.5" />
              <span class="slider-value" id="sizeValue">2.5</span>
            </div>
            <div class="slider-group" id="opacityGroup">
              <label for="opacitySlider">Opacity</label>
              <input type="range" id="opacitySlider" min="10" max="70" step="1" value="28" />
              <span class="slider-value" id="opacityValue">28%</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Photo -->
      <div class="mode-panel" data-panel="photo">
        <div id="photoAreaFront" style="display:none">
          <div class="photo-source-buttons" id="photoSourceFront">
            <button class="photo-source-btn" data-target="front" data-source="camera">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
              Camera
            </button>
            <button class="photo-source-btn" data-target="front" data-source="gallery">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
              Gallery
            </button>
          </div>
          <img class="photo-preview" id="photoPreviewFront" />
          <div class="photo-replace-row" id="photoReplaceFront">
            <button data-target="front" data-source="camera">Retake photo</button>
            <button data-target="front" data-source="gallery">Choose different</button>
          </div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="photoInputFrontCamera" style="display:none" />
        <input type="file" accept="image/*" id="photoInputFrontGallery" style="display:none" />

        <div id="photoAreaBack" style="display:none">
          <div class="photo-source-buttons" id="photoSourceBack">
            <button class="photo-source-btn" data-target="back" data-source="camera">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
              Camera
            </button>
            <button class="photo-source-btn" data-target="back" data-source="gallery">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
              Gallery
            </button>
          </div>
          <img class="photo-preview" id="photoPreviewBack" />
          <div class="photo-replace-row" id="photoReplaceBack">
            <button data-target="back" data-source="camera">Retake photo</button>
            <button data-target="back" data-source="gallery">Choose different</button>
          </div>
        </div>
        <input type="file" accept="image/*" capture="environment" id="photoInputBackCamera" style="display:none" />
        <input type="file" accept="image/*" id="photoInputBackGallery" style="display:none" />
      </div>
    </div>

    <div class="save-row">
      <button class="btn btn-ghost" id="saveAddAnotherBtn" style="flex:1">Save &amp; add another</button>
      <button class="btn btn-primary" id="saveDoneBtn" style="flex:1">Save &amp; finish</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/drive-sync.js"></script>
<script src="js/nav.js"></script>
<script src="js/theme.js"></script>
<script src="js/sakura.js"></script>
<script src="js/stars.js"></script>
<script src="js/canvas-draw.js"></script>
<script src="js/camera-capture.js"></script>
<script>
  if (RecallTheme.getTheme() === 'dark') { initStars(); } else { initSakura(); }

  const params = new URLSearchParams(window.location.search);
  const deckId = params.get('deck');
  if (!deckId) window.location.href = 'index.html';

  let currentSide = 'front';
  // Each side now has its OWN content type — front can be a photo while
  // back is typed text, etc. This used to be one global "mode" applied to
  // both sides at once, which forced a photo card to have a photo on both
  // faces; that's backwards for how flashcards actually work (the answer
  // explaining a photo is rarely itself another unrelated photo).
  const sideType = { front: 'text', back: 'text' };

  const state = {
    text: { front: '', back: '' },
    photoBlob: { front: null, back: null },
  };

  RecallDB.Decks.get(deckId).then((deck) => {
    document.getElementById('deckLabel').textContent = deck ? `Adding to: ${deck.name}` : 'Deck not found';
  });

  function renderActivePanel() {
    const type = sideType[currentSide];

    document.querySelectorAll('.side-toggle button').forEach((b) => {
      b.classList.toggle('active', b.dataset.side === currentSide);
    });
    document.querySelectorAll('.mode-tabs button').forEach((b) => {
      b.classList.toggle('active', b.dataset.mode === type);
    });

    document.getElementById('textInputFront').style.display = (currentSide === 'front' && type === 'text') ? 'block' : 'none';
    document.getElementById('textInputBack').style.display = (currentSide === 'back' && type === 'text') ? 'block' : 'none';

    const drawFrontVisible = currentSide === 'front' && type === 'draw';
    const drawBackVisible = currentSide === 'back' && type === 'draw';
    document.getElementById('drawCanvasFront').style.display = drawFrontVisible ? 'block' : 'none';
    document.getElementById('drawCanvasBack').style.display = drawBackVisible ? 'block' : 'none';
    document.getElementById('drawChrome').style.display = type === 'draw' ? 'block' : 'none';
    if (drawFrontVisible) drawPadFront.ensureSized();
    if (drawBackVisible) drawPadBack.ensureSized();
    if (type === 'draw') syncSlidersToActiveTool();

    document.getElementById('photoAreaFront').style.display = (currentSide === 'front' && type === 'photo') ? 'block' : 'none';
    document.getElementById('photoAreaBack').style.display = (currentSide === 'back' && type === 'photo') ? 'block' : 'none';
  }

  // Mode tabs — set the type for whichever side is currently selected.
  document.querySelectorAll('.mode-tabs button').forEach((btn) => {
    btn.addEventListener('click', () => {
      sideType[currentSide] = btn.dataset.mode;
      renderActivePanel();
    });
  });

  // Side toggle
  document.querySelectorAll('.side-toggle button').forEach((btn) => {
    btn.addEventListener('click', () => {
      currentSide = btn.dataset.side;
      renderActivePanel();
    });
  });

  document.getElementById('textInputFront').addEventListener('input', (e) => (state.text.front = e.target.value));
  document.getElementById('textInputBack').addEventListener('input', (e) => (state.text.back = e.target.value));

  // Draw pads
  const drawPadFront = createDrawPad(document.getElementById('drawCanvasFront'));
  const drawPadBack = createDrawPad(document.getElementById('drawCanvasBack'));
  document.getElementById('clearDrawBtn').addEventListener('click', () => {
    (currentSide === 'front' ? drawPadFront : drawPadBack).clear();
  });

  // Brush color/tool selection — applies to both pads so front/back share
  // the same active pencil, highlighter, or eraser.
  const sizeSlider = document.getElementById('sizeSlider');
  const sizeValue = document.getElementById('sizeValue');
  const opacityGroup = document.getElementById('opacityGroup');
  const opacitySlider = document.getElementById('opacitySlider');
  const opacityValue = document.getElementById('opacityValue');

  const SIZE_RANGES = {
    pencil: { min: 1, max: 8, step: 0.5 },
    highlighter: { min: 6, max: 30, step: 1 },
    eraser: { min: 10, max: 45, step: 1 },
  };

  function syncSlidersToActiveTool() {
    const category = drawPadFront.getActiveCategory();
    const range = SIZE_RANGES[category];
    sizeSlider.min = range.min;
    sizeSlider.max = range.max;
    sizeSlider.step = range.step;
    const size = drawPadFront.getSizeForActiveTool();
    sizeSlider.value = size;
    sizeValue.textContent = category === 'pencil' ? size : Math.round(size);

    const isHighlighterActive = category === 'highlighter';
    opacityGroup.classList.toggle('disabled', !isHighlighterActive);
    const pct = Math.round(drawPadFront.getHighlighterOpacity() * 100);
    opacitySlider.value = pct;
    opacityValue.textContent = pct + '%';
  }

  sizeSlider.addEventListener('input', () => {
    const val = parseFloat(sizeSlider.value);
    sizeValue.textContent = drawPadFront.getActiveCategory() === 'pencil' ? val : Math.round(val);
    drawPadFront.setSize(val);
    drawPadBack.setSize(val);
  });

  opacitySlider.addEventListener('input', () => {
    const pct = parseInt(opacitySlider.value, 10);
    opacityValue.textContent = pct + '%';
    const alpha = pct / 100;
    drawPadFront.setHighlighterOpacity(alpha);
    drawPadBack.setHighlighterOpacity(alpha);
  });

  document.querySelectorAll('.swatch').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach((b) => b.classList.remove('selected'));
      btn.classList.add('selected');

      if (btn.dataset.eraser === 'true') {
        drawPadFront.setEraser();
        drawPadBack.setEraser();
        syncSlidersToActiveTool();
        return;
      }

      const isHighlighter = btn.dataset.highlighter === 'true';
      const palette = isHighlighter ? HIGHLIGHTER_COLORS : PENCIL_COLORS;
      const hex = palette[btn.dataset.color];
      drawPadFront.setTool(hex, isHighlighter);
      drawPadBack.setTool(hex, isHighlighter);
      syncSlidersToActiveTool();
    });
  });

  // Photo capture — two explicit sources per side (camera vs gallery),
  // rather than one ambiguous input whose behavior varies by browser/OS.
  function wirePhoto(side) {
    const cap = side.charAt(0).toUpperCase() + side.slice(1);
    const cameraInput = document.getElementById(`photoInput${cap}Camera`);
    const galleryInput = document.getElementById(`photoInput${cap}Gallery`);
    const preview = document.getElementById(`photoPreview${cap}`);
    const sourceButtons = document.getElementById(`photoSource${cap}`);
    const replaceRow = document.getElementById(`photoReplace${cap}`);

    async function handleFile(file) {
      if (!file) return;
      const blob = await compressImageFile(file);
      state.photoBlob[side] = blob;
      preview.src = URL.createObjectURL(blob);
      preview.style.display = 'block';
      sourceButtons.style.display = 'none';
      replaceRow.style.display = 'flex';
    }

    cameraInput.addEventListener('change', () => handleFile(cameraInput.files[0]));
    galleryInput.addEventListener('change', () => handleFile(galleryInput.files[0]));

    // Both the initial source buttons and the post-capture "replace" row
    // use the same data-source routing to the right hidden input.
    document.querySelectorAll(`[data-target="${side}"]`).forEach((btn) => {
      btn.addEventListener('click', () => {
        (btn.dataset.source === 'camera' ? cameraInput : galleryInput).click();
      });
    });

    return {
      reset() {
        preview.style.display = 'none';
        preview.src = '';
        sourceButtons.style.display = 'flex';
        replaceRow.style.display = 'none';
      },
    };
  }
  const photoUiFront = wirePhoto('front');
  const photoUiBack = wirePhoto('back');

  renderActivePanel();

  // Builds one face (front or back) independently, based on THAT side's own
  // selected type — this is the whole point of the per-side model: front
  // can be a photo while back is typed text, etc.
  async function buildFace(side) {
    const type = sideType[side];
    if (type === 'text') {
      const text = state.text[side].trim();
      return text ? { kind: 'text', text } : null;
    }
    if (type === 'draw') {
      const pad = side === 'front' ? drawPadFront : drawPadBack;
      if (pad.isEmpty()) return null;
      return { kind: 'draw', imageBlob: await pad.toBlob() };
    }
    if (type === 'photo') {
      const blob = state.photoBlob[side];
      return blob ? { kind: 'photo', imageBlob: blob } : null;
    }
    return null;
  }

  async function buildCardPayload() {
    const front = await buildFace('front');
    const back = await buildFace('back');
    if (!front && !back) return null;
    return {
      deckId,
      // Legacy summary field some older screens still read; per-face
      // `kind` on front/back is the source of truth going forward.
      type: (front && front.kind) || (back && back.kind) || 'text',
      front: front || {},
      back: back || {},
    };
  }

  function resetForm() {
    document.getElementById('textInputFront').value = '';
    document.getElementById('textInputBack').value = '';
    state.text = { front: '', back: '' };
    drawPadFront.clear();
    drawPadBack.clear();
    state.photoBlob = { front: null, back: null };
    photoUiFront.reset();
    photoUiBack.reset();
    // Deliberately NOT resetting sideType — if you just added a
    // photo-front/text-back card, you're likely adding several more like
    // it, so keep the same type selection for the next one.
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1400);
  }

  async function saveCard() {
    const payload = await buildCardPayload();
    if (!payload) {
      showToast('Add some content first');
      return false;
    }
    await RecallDB.Cards.create(payload);
    return true;
  }

  document.getElementById('saveAddAnotherBtn').addEventListener('click', async () => {
    if (await saveCard()) {
      showToast('Card saved 🌸');
      resetForm();
    }
  });

  document.getElementById('saveDoneBtn').addEventListener('click', async () => {
    if (await saveCard()) {
      showToast('Saving…');
      RecallNav.goTo(`study.html?deck=${deckId}`);
    }
  });
</script>
</body>
</html>
