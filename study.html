<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study — Recall Manual</title>
<link rel="stylesheet" href="css/theme.css" />
<script>
  (function () {
    try {
      if ((localStorage.getItem('recall_manual_theme') || 'light') === 'dark') {
        document.documentElement.classList.add('theme-dark');
      }
    } catch (e) {}
  })();
</script>
<style>
  .back-link { font-size: 0.85rem; color: var(--ink-soft); }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .study-all-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.78rem; color: var(--ink-soft);
  }

  .progress-track {
    height: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.5);
    overflow: hidden;
    margin: 14px 0 4px;
  }
  .progress-fill {
    height: 100%;
    background: var(--blossom);
    width: 0%;
    transition: width 0.25s ease;
  }
  .progress-text { font-size: 0.78rem; color: var(--ink-soft); text-align: right; }

  #cardStage {
    perspective: 1400px;
    margin: 28px 0 8px;
    display: flex;
    justify-content: center;
  }

  .flip-hint {
    text-align: center;
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  .flip-card {
    width: 100%;
    max-width: 480px;
    height: 340px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    cursor: pointer;
  }
  .flip-card.flipped { transform: rotateY(180deg); cursor: default; }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: var(--radius-lg);
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--shadow-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    overflow-y: auto;
  }
  .card-back { transform: rotateY(180deg); }

  .card-text {
    font-family: var(--font-body);
    font-size: 1.15rem;
    line-height: 1.5;
    color: var(--ink);
    text-align: center;
    white-space: pre-wrap;
  }
  .card-image {
    max-width: 100%;
    max-height: 100%;
    border-radius: var(--radius-sm);
    object-fit: contain;
  }

  .rating-row {
    display: none;
    gap: 8px;
    margin-top: 18px;
  }
  .rating-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 12px 6px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.85rem;
    color: white;
  }
  .rating-btn .rating-interval { font-size: 0.68rem; font-weight: 500; opacity: 0.85; }
  .rating-btn[data-rating="again"] { background: var(--tag-red); }
  .rating-btn[data-rating="hard"] { background: #e0a860; }
  .rating-btn[data-rating="good"] { background: var(--tag-green); }
  .rating-btn[data-rating="easy"] { background: var(--blossom); }

  .retire-row { display: flex; justify-content: center; margin-top: 12px; }
  .retire-btn {
    border: none;
    background: none;
    color: var(--ink-soft);
    font-size: 0.75rem;
    text-decoration: underline;
    cursor: pointer;
  }

  .nav-row {
    display: flex;
    gap: 12px;
    margin-top: 22px;
  }
  .nav-row button, .nav-row a { flex: 1; }

  .empty-state, .complete-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state h2, .complete-state h2 { font-family: var(--font-display); color: var(--ink); margin-bottom: 8px; }
  .complete-state { display: none; }
</style>
</head>
<body>
<canvas id="sakura-canvas"></canvas>

<div class="app-shell">
  <div class="topbar">
    <div>
      <a class="back-link" href="index.html" id="backToDecksLink">&larr; Decks</a>
      <h1 id="deckName" style="margin-top:4px">Study</h1>
    </div>
    <label class="study-all-label">
      <input type="checkbox" id="studyAllToggle" />
      Study all cards
    </label>
  </div>

  <div class="container">
    <div id="studyArea">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0 / 0 reviewed</div>

      <div id="cardStage">
        <div class="flip-card" id="flipCard">
          <div class="card-face card-front" id="cardFront"></div>
          <div class="card-face card-back" id="cardBack"></div>
        </div>
      </div>
      <div class="flip-hint" id="flipHint">Tap the card to reveal the answer</div>

      <div class="rating-row" id="ratingRow">
        <button class="rating-btn" data-rating="again">Again<span class="rating-interval"></span></button>
        <button class="rating-btn" data-rating="hard">Hard<span class="rating-interval"></span></button>
        <button class="rating-btn" data-rating="good">Good<span class="rating-interval"></span></button>
        <button class="rating-btn" data-rating="easy">Easy<span class="rating-interval"></span></button>
      </div>

      <div class="retire-row">
        <button class="retire-btn" id="retireBtn">Retire this card (exclude from future reviews)</button>
      </div>
    </div>

    <div class="empty-state" id="emptyState" style="display:none">
      <h2>No cards in this deck yet</h2>
      <p>Go back and add some cards first.</p>
    </div>

    <div class="complete-state" id="completeState">
      <h2>All caught up 🌸</h2>
      <p>Nothing due right now. Come back later, or study the whole deck anyway using the toggle above.</p>
      <div class="nav-row" style="max-width:320px; margin:20px auto 0">
        <button class="btn btn-ghost" id="restartBtn">Check again</button>
        <a class="btn btn-primary" href="index.html" id="completeDecksLink" style="text-align:center">Decks</a>
      </div>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/db.js"></script>
<script src="js/drive-sync.js"></script>
<script src="js/nav.js"></script>
<script src="js/theme.js"></script>
<script src="js/offline.js"></script>
<script src="js/sakura.js"></script>
<script src="js/stars.js"></script>
<script src="js/srs.js"></script>
<script src="js/study.js"></script>
<script>
  if (RecallTheme.getTheme() === 'dark') { initStars(); } else { initSakura(); }
  ['backToDecksLink', 'completeDecksLink'].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', (e) => {
      e.preventDefault();
      RecallNav.goTo(el.getAttribute('href'));
    });
  });
</script>
</body>
</html>
