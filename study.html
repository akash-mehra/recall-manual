<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study — Recall Manual</title>
<link rel="stylesheet" href="css/theme.css" />
<style>
  .back-link { font-size: 0.85rem; color: var(--ink-soft); }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .hide-struck-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.78rem; color: var(--ink-soft);
  }

  .progress-track {
    height: 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.5);
    overflow: hidden;
    margin: 14px 0 4px;
  }
  .progress-fill {
    height: 100%;
    background: var(--blossom);
    width: 0%;
    transition: width 0.25s ease;
  }
  .progress-text { font-size: 0.78rem; color: var(--ink-soft); text-align: right; }

  #cardStage {
    perspective: 1400px;
    margin: 28px 0;
    display: flex;
    justify-content: center;
  }

  .flip-card {
    width: 100%;
    max-width: 480px;
    height: 340px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    cursor: pointer;
  }
  .flip-card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: var(--radius-lg);
    background: var(--glass-fill);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--shadow-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    overflow-y: auto;
  }
  .card-back { transform: rotateY(180deg); }

  .card-text {
    font-family: var(--font-body);
    font-size: 1.15rem;
    line-height: 1.5;
    color: var(--ink);
    text-align: center;
    white-space: pre-wrap;
  }
  .card-image {
    max-width: 100%;
    max-height: 100%;
    border-radius: var(--radius-sm);
    object-fit: contain;
  }

  /* Color-state tinting */
  .flip-card.tag-green .card-face { box-shadow: 0 8px 32px rgba(143, 188, 148, 0.35), inset 0 0 0 2px var(--tag-green); }
  .flip-card.tag-yellow .card-face { box-shadow: 0 8px 32px rgba(232, 184, 114, 0.35), inset 0 0 0 2px var(--tag-yellow); }
  .flip-card.tag-red .card-face { box-shadow: 0 8px 32px rgba(224, 138, 138, 0.35), inset 0 0 0 2px var(--tag-red); }

  /* Struck state */
  .flip-card.struck .card-face { opacity: 0.55; }
  .flip-card.struck .card-text { text-decoration: line-through; text-decoration-color: var(--ink-soft); }

  .controls-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-top: 6px;
  }
  .color-dots { display: flex; gap: 10px; }
  .color-dot {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.8);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .color-dot[data-color="green"] { background: var(--tag-green); }
  .color-dot[data-color="yellow"] { background: var(--tag-yellow); }
  .color-dot[data-color="red"] { background: var(--tag-red); }
  .color-dot.selected { box-shadow: 0 0 0 3px var(--ink); }

  .strike-btn {
    border: 1px solid var(--glass-border);
    background: var(--glass-fill-strong);
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }

  .nav-row {
    display: flex;
    gap: 12px;
    margin-top: 22px;
  }
  .nav-row button { flex: 1; }

  .empty-state, .complete-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state h2, .complete-state h2 { font-family: var(--font-display); color: var(--ink); margin-bottom: 8px; }
  .complete-state { display: none; }
</style>
</head>
<body>
<canvas id="sakura-canvas"></canvas>

<div class="app-shell">
  <div class="topbar">
    <div>
      <a class="back-link" href="index.html">&larr; Decks</a>
      <h1 id="deckName" style="margin-top:4px">Study</h1>
    </div>
    <label class="hide-struck-label">
      <input type="checkbox" id="hideStruckToggle" />
      Hide struck
    </label>
  </div>

  <div class="container">
    <div id="studyArea">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0 / 0</div>

      <div id="cardStage">
        <div class="flip-card" id="flipCard">
          <div class="card-face card-front" id="cardFront"></div>
          <div class="card-face card-back" id="cardBack"></div>
        </div>
      </div>

      <div class="controls-row">
        <div class="color-dots">
          <div class="color-dot" data-color="green" title="Know it"></div>
          <div class="color-dot" data-color="yellow" title="Shaky"></div>
          <div class="color-dot" data-color="red" title="Don't know"></div>
        </div>
        <button class="strike-btn" id="strikeBtn">Strike ✓</button>
      </div>

      <div class="nav-row">
        <button class="btn btn-ghost" id="prevBtn">Previous</button>
        <button class="btn btn-primary" id="nextBtn">Next</button>
      </div>
    </div>

    <div class="empty-state" id="emptyState" style="display:none">
      <h2>No cards in this deck yet</h2>
      <p>Go back and add some cards first.</p>
    </div>

    <div class="complete-state" id="completeState">
      <h2>Session complete 🌸</h2>
      <p>Nice work. You can go through the deck again or head back to your decks.</p>
      <div class="nav-row" style="max-width:320px; margin:20px auto 0">
        <button class="btn btn-ghost" id="restartBtn">Restart</button>
        <a class="btn btn-primary" href="index.html" style="text-align:center">Decks</a>
      </div>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/sakura.js"></script>
<script src="js/study.js"></script>
<script>initSakura();</script>
</body>
</html>
